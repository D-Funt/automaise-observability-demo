groups:
  - name: usecase-alerts
    rules:
      - alert: HighUseCaseFailureRate
        expr: >
          (
            sum by (usecase) (rate(usecase_executions_total{status="failure"}[5m]))
            /
            sum by (usecase) (rate(usecase_executions_total[5m]))
          ) > 0.35
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High failure rate on use case {{ $labels.usecase }}"
          description: >
            Use case {{ $labels.usecase }} has exceeded a 35% failure rate
            over the last 5 minutes. Check for possible model degradation
            or a channel integration issue.
